name: Send email

on:
  schedule:
    # 8:00 AM EST every day. GitHub Actions cron uses UTC, so this is 13:00 UTC.
    - cron: '0 13 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: read-all

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Last successful run
        id: last_success
        run: echo "LAST_SUCCESS=$(gh api -XGET repos/${{ github.repository_owner }}/${{ github.event.repository.name }}/actions/workflows/send-email.yaml/runs --jq '.workflow_runs[0].run_started_at' -F status=success -F per_page=1)" >> $GITHUB_OUTPUT
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - run: npm ci

      - name: Verify
        run: npm run verify

      - name: Create email
        run: npm run email actionUrl=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} lastSuccess=${{ steps.last_success.outputs.LAST_SUCCESS }}

      - name: Check email exists
        id: check_email
        run: |
          if [ -f dist/email.html ]; then
            echo "files_exists=true" >> $GITHUB_OUTPUT
            echo "### New update email :inbox_tray:" >> $GITHUB_STEP_SUMMARY
          else
            echo "### No updates since last run :zzz:" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Load SMTP defaults from config.yml
        if: steps.check_email.outputs.files_exists == 'true'
        id: smtp_defaults
        run: |
          node <<'NODE'
          const fs = require('node:fs')
          const config = fs.readFileSync('config.yml', 'utf8')
          const readValue = (key) => {
            const line = config
              .split(/\r?\n/)
              .find((entry) => entry.trimStart().startsWith(`${key}:`))
            if (!line) return ''
            const raw = line.slice(line.indexOf(':') + 1).trim()
            const singleQuoted = raw.startsWith("'") && raw.endsWith("'")
            const doubleQuoted = raw.startsWith('"') && raw.endsWith('"')
            return singleQuoted || doubleQuoted ? raw.slice(1, -1) : raw
          }

          const server = readValue('smtp_server')
          const port = readValue('smtp_port')

          if (!server || !port) {
            console.error('Missing smtp_server or smtp_port in config.yml')
            process.exit(1)
          }

          fs.appendFileSync(process.env.GITHUB_OUTPUT, `server=${server}\nport=${port}\n`)
          NODE

      - name: Resolve SMTP configuration
        if: steps.check_email.outputs.files_exists == 'true'
        id: smtp
        env:
          SMTP_SERVER_VAR: ${{ vars.SMTP_SERVER }}
          SMTP_PORT_VAR: ${{ vars.SMTP_PORT }}
          SMTP_SERVER_DEFAULT: ${{ steps.smtp_defaults.outputs.server }}
          SMTP_PORT_DEFAULT: ${{ steps.smtp_defaults.outputs.port }}
        run: |
          SMTP_SERVER="${SMTP_SERVER_VAR:-$SMTP_SERVER_DEFAULT}"
          SMTP_PORT="${SMTP_PORT_VAR:-$SMTP_PORT_DEFAULT}"
          echo "server=$SMTP_SERVER" >> "$GITHUB_OUTPUT"
          echo "port=$SMTP_PORT" >> "$GITHUB_OUTPUT"

      - name: Validate SMTP configuration
        if: steps.check_email.outputs.files_exists == 'true'
        run: |
          if [ -z "${{ steps.smtp.outputs.server }}" ]; then
            echo "Missing SMTP server in repository variable SMTP_SERVER and config.yml email_settings.smtp_server" >&2
            exit 1
          fi
          if [ -z "${{ steps.smtp.outputs.port }}" ]; then
            echo "Missing SMTP port in repository variable SMTP_PORT and config.yml email_settings.smtp_port" >&2
            exit 1
          fi

      - name: Send email
        if: steps.check_email.outputs.files_exists == 'true'
        uses: dawidd6/action-send-mail@v3.12.0
        with:
          server_address: ${{ steps.smtp.outputs.server }}
          server_port: ${{ steps.smtp.outputs.port }}

          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}

          subject: RSS to Email
          to: ${{ secrets.MAIL_TO }}
          from: ${{ secrets.SMTP_USERNAME }}

          html_body: file://dist/email.html
